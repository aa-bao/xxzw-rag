services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rag
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  wx-channels:
    platform: linux/amd64
    build:
      context: wx-channels
      dockerfile: Dockerfile
    environment:
      WX_VIDEO_HOME: /data
      WX_CHANNELS_DOWNLOAD_CONFIG_FILEPATH: /data/config.yaml
    ports:
      - "127.0.0.1:2022:2022"
      - "127.0.0.1:2023:2023"
    volumes:
      - wxchannels:/data
      - ./rag-service/wx-cookies:/cookies
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2022/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  rag:
    build:
      context: rag-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/rag
      MODEL_RELAY_BASE_URL: ${MODEL_RELAY_BASE_URL}
      MODEL_RELAY_API_KEY: ${MODEL_RELAY_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      RPA_APP_KEY: rag-database
      RPA_ENVIRONMENT: LOCAL
      RPA_RELEASE_VERSION: dev
      RPA_SOURCE_COMMIT: local
      WX_CHANNELS_API_BASE_URL: http://wx-channels:2022
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      wx-channels:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/platform/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - uploads:/opt/tyt-rpa/app/data/uploads
      - chroma:/opt/tyt-rpa/app/data/chroma
      - fts:/opt/tyt-rpa/app/data/fts
      - ./rag-service/wx-cookies:/opt/tyt-rpa/app/wx-cookies

  web:
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      BACKEND_ORIGIN: http://rag:8000
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/platform/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mysqldata:
  uploads:
  chroma:
  fts:
  wxchannels:
