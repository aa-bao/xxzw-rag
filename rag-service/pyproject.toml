[project]
name = "rag-service"
version = "0.1.0"
description = "Local multi-user RAG service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncmy>=0.2.10",
  "chromadb>=0.5",
  "fastapi>=0.115",
  "httpx>=0.28",
  "ijson>=3.4,<4",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "tiktoken>=0.8",
  "typer>=0.15",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
